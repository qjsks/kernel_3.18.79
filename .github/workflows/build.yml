name: Build MT6580 Kernel

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libncurses5-dev \
            libelf-dev zip python3 device-tree-compiler \
            gcc-arm-linux-gnueabi

      - name: Show host gcc
        run: |
          gcc --version | head -1
          # 关键：GCC10+ 的 -fno-common 会让老内核 host 工具（dtc 等）链接失败，
          # 编译时用 HOSTCFLAGS="-fcommon" 修掉，不需要降级 gcc

      - name: Setup toolchain
        run: |
          mkdir -p $HOME/tc
          cd $HOME/tc
          OK=0
          for URL in \
            "https://releases.linaro.org/components/toolchain/binaries/6.3-2017.05/arm-eabi/gcc-linaro-6.3.1-2017.05-x86_64_arm-eabi.tar.xz" \
            "https://mirrors.tuna.tsinghua.edu.cn/armbian-releases/_toolchains/gcc-linaro-6.3.1-2017.05-x86_64_arm-eabi.tar.xz" ; do
            echo "try $URL"
            curl -sSL -m 300 -o tc.tar.xz "$URL" || continue
            SZ=$(stat -c%s tc.tar.xz 2>/dev/null || echo 0)
            echo "size=$SZ"
            if [ "$SZ" -gt 50000000 ]; then OK=1; break; fi
          done
          if [ "$OK" = "1" ]; then
            tar -xf tc.tar.xz
            TC=$(ls -d gcc-linaro-*/bin 2>/dev/null | head -1)
            echo "TC_PATH=$HOME/tc/$TC" >> $GITHUB_ENV
            echo "CC_PREFIX=arm-eabi-" >> $GITHUB_ENV
            echo "Linaro 6.3 OK"
          else
            sudo apt-get install -y -qq gcc-arm-linux-gnueabi
            echo "TC_PATH=/usr/bin" >> $GITHUB_ENV
            echo "CC_PREFIX=arm-linux-gnueabi-" >> $GITHUB_ENV
            echo "回退 apt 交叉编译器（soft-float）"
          fi

      - name: Build kernel
        run: |
          export PATH=$TC_PATH:$PATH
          export LC_ALL=C
          echo "=== 交叉编译器 ==="
          ${CC_PREFIX}gcc --version | head -1
          echo "=== 验证 armv7-a 支持 ==="
          echo 'int main(){return 0;}' > /tmp/t.c
          ${CC_PREFIX}gcc -march=armv7-a -c /tmp/t.c -o /tmp/t.o && echo "armv7-a OK" || echo "armv7-a FAIL"
          echo "=== defconfig ==="
          make ARCH=arm CROSS_COMPILE=$CC_PREFIX bb06_defconfig
          echo "=== 确认 CPU_V7 已启用 ==="
          grep -E "CONFIG_CPU_V7|CONFIG_CPU_32v7" .config || echo "  CPU_V7 未启用！"
          echo "=== 编译 ==="
          make ARCH=arm CROSS_COMPILE=$CC_PREFIX -j$(nproc) \
               HOSTCFLAGS="-fcommon -w" HOSTCXXFLAGS="-fcommon -w" \
               KCFLAGS="-mtune=cortex-a7" \
               zImage 2>&1 | tail -80

      - name: Package
        if: always()
        run: |
          mkdir -p out
          if [ -f arch/arm/boot/zImage ]; then
            cp arch/arm/boot/zImage out/
            echo "zImage: $(stat -c%s arch/arm/boot/zImage) bytes"
          else
            echo "zImage NOT built"
            find . -name "zImage" -o -name "Image.gz" 2>/dev/null | head -5
          fi
          ls -la out/ || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-bb06
          path: out/
          if-no-files-found: warn
          retention-days: 30
